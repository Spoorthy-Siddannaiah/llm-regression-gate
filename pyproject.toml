[build-system]
requires = [
    "hatchling==1.27.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "llm-reliability-platform"
version = "0.1.0"
description = "Reproducible, local LLM regression checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/Spoorthy-Siddannaiah/llm-regression-gate"
Issues = "https://github.com/Spoorthy-Siddannaiah/llm-regression-gate/issues"

[project.scripts]
llm-reliability = "llm_reliability.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
